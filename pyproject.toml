[project]
name = "agririsk-kenya"
version = "0.1.0"
description = "Early-warning and decision-support prototype for climate-resilient agriculture and food security in Kenya."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "geopandas>=1.0.0",
    "joblib>=1.4.0",
    "matplotlib>=3.11.2",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.5.0",
    "shapely>=2.0.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.38.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agririsk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
